<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié | VerAccessoire</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container" style="max-width:480px; margin: 40px auto; padding: 20px;">
    <h1>Mot de passe oublié</h1>
    <p>Entrez votre email ci-dessous. Un lien de réinitialisation sera simulé (en développement).</p>

    <form id="forgotForm">
      <div style="margin-bottom:12px;">
        <label for="email">Email:</label>
        <input type="email" id="email" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
      </div>
      <button class="btn btn-primary" style="width:100%;">Envoyer le lien</button>
    </form>

    <div id="status" style="margin-top:16px; display:none;"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/bootstrap.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.style.color = 'green';
      status.textContent = 'Envoi en cours...';

      try {
        const resp = await fetch((window.API_BASE_URL || window.location.origin + '/api') + '/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const j = await resp.json();
        if (j.token) {
          status.textContent = 'DEBUG: Token généré (voir console)';
          console.log('Password reset token (debug):', j.token);
          // show direct link for local testing
          const link = document.createElement('a');
          link.href = '/reset-password.html?token=' + encodeURIComponent(j.token);
          link.textContent = 'Ouvrir le lien de réinitialisation (debug)';
          link.style.display = 'block';
          link.style.marginTop = '12px';
          status.appendChild(link);
        } else {
          status.textContent = j.message || 'Si cet email existe, un lien de réinitialisation a été envoyé.';
        }
        setTimeout(() => { window.location.href = '/login.html'; }, 2200);
      } catch (err) {
        status.style.color = 'red';
        status.textContent = 'Erreur lors de l envoi';
        console.error(err);
      }
    });
  </script>
</body>
</html>
