<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe | VerAccessoire</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container" style="max-width:480px; margin: 40px auto; padding: 20px;">
    <h1>Réinitialiser le mot de passe</h1>
    <p>Entrez votre nouveau mot de passe.</p>

    <form id="resetForm">
      <div style="margin-bottom:12px;">
        <label for="password">Nouveau mot de passe:</label>
        <input type="password" id="password" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
      </div>
      <div style="margin-bottom:12px;">
        <label for="confirm">Confirmer le mot de passe:</label>
        <input type="password" id="confirm" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
      </div>
      <button class="btn btn-primary" style="width:100%;">Réinitialiser</button>
    </form>

    <div id="status" style="margin-top:16px; display:none;"></div>
  </div>

  <script>
    function getQuery(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value.trim();
      const conf = document.getElementById('confirm').value.trim();
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.style.color = 'green';

      if (!pw || pw !== conf) {
        status.style.color = 'red';
        status.textContent = 'Les mots de passe ne correspondent pas.';
        return;
      }

      const token = getQuery('token');
      if (!token) {
        status.style.color = 'red';
        status.textContent = 'Token manquant dans l URL.';
        return;
      }

      try {
        const resp = await fetch((window.API_BASE_URL || window.location.origin + '/api') + '/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pw })
        });
        const j = await resp.json();
        if (resp.ok) {
          status.style.color = 'green';
          status.textContent = j.message || 'Mot de passe réinitialisé avec succès';
          setTimeout(() => { window.location.href = '/login.html'; }, 1800);
        } else {
          status.style.color = 'red';
          status.textContent = j.error || 'Erreur lors de la réinitialisation';
        }
      } catch (err) {
        status.style.color = 'red';
        status.textContent = 'Erreur réseau';
        console.error(err);
      }
    });
  </script>
</body>
</html>
