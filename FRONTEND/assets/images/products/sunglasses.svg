<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Frame left -->
  <rect x="20" y="40" width="60" height="50" rx="10" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Frame right -->
  <rect x="120" y="40" width="60" height="50" rx="10" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="80" y1="60" x2="120" y2="60" stroke="#333" stroke-width="3"/>
  <!-- Left lens -->
  <circle cx="50" cy="65" r="25" fill="#87CEEB" opacity="0.6"/>
  <!-- Right lens -->
  <circle cx="150" cy="65" r="25" fill="#87CEEB" opacity="0.6"/>
  <!-- Left temple -->
  <path d="M 20 55 Q 10 55 5 70" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 180 55 Q 190 55 195 70" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>