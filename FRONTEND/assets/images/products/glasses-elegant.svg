<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Round frame left -->
  <circle cx="50" cy="65" r="30" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Round frame right -->
  <circle cx="150" cy="65" r="30" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="80" y1="65" x2="120" y2="65" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Left lens -->
  <circle cx="50" cy="65" r="26" fill="#1a1a1a" opacity="0.7"/>
  <!-- Right lens -->
  <circle cx="150" cy="65" r="26" fill="#1a1a1a" opacity="0.7"/>
  <!-- Left temple -->
  <path d="M 20 55 Q 5 50 0 60" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 180 55 Q 195 50 200 60" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Reflections -->
  <circle cx="42" cy="57" r="4" fill="white" opacity="0.8"/>
  <circle cx="142" cy="57" r="4" fill="white" opacity="0.8"/>
</svg>