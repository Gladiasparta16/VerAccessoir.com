<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Square frame left -->
  <rect x="25" y="40" width="50" height="50" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Square frame right -->
  <rect x="125" y="40" width="50" height="50" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="75" y1="65" x2="125" y2="65" stroke="#000" stroke-width="3"/>
  <!-- Left lens -->
  <rect x="25" y="40" width="50" height="50" fill="#666" opacity="0.5"/>
  <!-- Right lens -->
  <rect x="125" y="40" width="50" height="50" fill="#666" opacity="0.5"/>
  <!-- Left temple -->
  <path d="M 25 50 L 10 45" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 175 50 L 190 45" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Highlights for 3D effect -->
  <line x1="35" y1="45" x2="65" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="135" y1="45" x2="165" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>