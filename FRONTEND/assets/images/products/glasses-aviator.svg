<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Aviator style frame left -->
  <polygon points="50,35 70,40 65,90 35,85" fill="none" stroke="#d4af37" stroke-width="3"/>
  <!-- Aviator style frame right -->
  <polygon points="150,35 170,40 165,90 135,85" fill="none" stroke="#d4af37" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="65" y1="60" x2="135" y2="60" stroke="#d4af37" stroke-width="3"/>
  <!-- Left lens -->
  <polygon points="50,35 70,40 65,90 35,85" fill="#ffa500" opacity="0.4"/>
  <!-- Right lens -->
  <polygon points="150,35 170,40 165,90 135,85" fill="#ffa500" opacity="0.4"/>
  <!-- Left temple -->
  <path d="M 35 85 Q 20 90 10 100" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 165 85 Q 180 90 190 100" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>