<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Classic frame left -->
  <ellipse cx="50" cy="65" rx="30" ry="35" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <!-- Classic frame right -->
  <ellipse cx="150" cy="65" rx="30" ry="35" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="80" y1="65" x2="120" y2="65" stroke="#2c3e50" stroke-width="3"/>
  <!-- Left lens -->
  <ellipse cx="50" cy="65" rx="25" ry="30" fill="#a0e7e5" opacity="0.5"/>
  <!-- Right lens -->
  <ellipse cx="150" cy="65" rx="25" ry="30" fill="#a0e7e5" opacity="0.5"/>
  <!-- Left temple -->
  <path d="M 20 50 L 10 30" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 180 50 L 190 30" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>