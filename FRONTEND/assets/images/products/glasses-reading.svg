<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Reading glasses frame left -->
  <ellipse cx="50" cy="70" rx="32" ry="28" fill="none" stroke="#8b4513" stroke-width="3"/>
  <!-- Reading glasses frame right -->
  <ellipse cx="150" cy="70" rx="32" ry="28" fill="none" stroke="#8b4513" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="82" y1="70" x2="118" y2="70" stroke="#8b4513" stroke-width="3"/>
  <!-- Left lens -->
  <ellipse cx="50" cy="70" rx="28" ry="24" fill="#fffacd" opacity="0.6"/>
  <!-- Right lens -->
  <ellipse cx="150" cy="70" rx="28" ry="24" fill="#fffacd" opacity="0.6"/>
  <!-- Left temple -->
  <path d="M 18 60 Q 5 50 0 40" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M 182 60 Q 195 50 200 40" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Text indicator -->
  <text x="100" y="110" font-size="12" text-anchor="middle" fill="#666">Reading</text>
</svg>