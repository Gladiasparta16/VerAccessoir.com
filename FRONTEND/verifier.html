<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification Système | VerAccessoire</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .check-item {
      display: flex;
      align-items: center;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f5f5f5;
      transition: all 0.3s;
    }
    .check-item.ok {
      background: #d4edda;
      border-left: 4px solid #28a745;
    }
    .check-item.error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
    }
    .check-item.warning {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
    }
    .icon {
      font-size: 20px;
      margin-right: 15px;
      min-width: 30px;
    }
    .status-text {
      flex: 1;
    }
    .status-text strong {
      display: block;
      margin-bottom: 3px;
    }
    .status-text small {
      color: #666;
    }
    .actions {
      margin-top: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background: #5a6268;
      transform: translateY(-2px);
    }
    .divider {
      border-top: 1px solid #eee;
      margin: 30px 0;
    }
    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .info-box strong {
      color: #1976D2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>🔍</span>
      Vérification du Système
    </h1>
    <p class="subtitle">VerAccessoire - Statut des services</p>

    <div class="info-box">
      <strong>💡 Note:</strong> Cette page vérifie que tous les services fonctionnent correctement.
    </div>

    <div id="checks"></div>

    <div class="divider"></div>

    <div class="actions">
      <a href="http://localhost:8000/index.html" class="btn btn-primary">🏠 Aller à l'accueil</a>
      <a href="http://localhost:8000/FRONTEND/pages/admin-login.html" class="btn btn-secondary">🔐 Admin</a>
    </div>
  </div>

  <script>
    const checks = [
      {
        name: 'Page Frontend',
        test: () => {
          return typeof document !== 'undefined';
        }
      },
      {
        name: 'JavaScript',
        test: () => {
          return typeof window !== 'undefined' && typeof window.document !== 'undefined';
        }
      },
      {
        name: 'LocalStorage',
        test: () => {
          try {
            const test = '__test__';
            localStorage.setItem(test, test);
            localStorage.removeItem(test);
            return true;
          } catch (e) {
            return false;
          }
        }
      },
      {
        name: 'API Backend (5000)',
        test: async () => {
          try {
            const response = await fetch('/api/health', { timeout: 2000 });
            return response.ok;
          } catch (e) {
            return false;
          }
        }
      },
      {
        name: 'Produits SVG',
        test: () => {
          try {
            return document.querySelector ? true : false;
          } catch (e) {
            return false;
          }
        }
      }
    ];

    async function runChecks() {
      const checksDiv = document.getElementById('checks');
      checksDiv.innerHTML = '';

      for (const check of checks) {
        let result;
        try {
          result = await check.test();
        } catch (e) {
          result = false;
        }

        const item = document.createElement('div');
        item.className = `check-item ${result ? 'ok' : 'error'}`;
        
        const statusText = result ? '✅ OK' : '❌ Erreur';
        const details = result ? 'Fonctionne correctement' : 'Vérifiez votre configuration';
        
        item.innerHTML = `
          <div class="icon">${result ? '✓' : '✕'}</div>
          <div class="status-text">
            <strong>${check.name}</strong>
            <small>${details}</small>
          </div>
        `;
        
        checksDiv.appendChild(item);
      }

      // Vérification spéciale: API Backend
      setTimeout(() => {
        const apiItem = checksDiv.children[3];
        if (apiItem && apiItem.classList.contains('error')) {
          const statusText = apiItem.querySelector('.status-text');
          statusText.innerHTML = `
            <strong>API Backend (5000)</strong>
            <small>Assurez-vous que le serveur Flask est lancé avec: python BACKEND/app.py</small>
          `;
        }
      }, 2500);
    }

    // Lancer les vérifications au chargement
    runChecks();

    // Re-vérifier toutes les 5 secondes
    setInterval(runChecks, 5000);
  </script>
</body>
</html>
