version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: verra_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: verra_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: BACKEND/Dockerfile
    environment:
      - DATABASE_URL=postgresql://verra_user:change_me@db:5432/verra_db
      - SECRET_KEY=change_me_secret
      - JWT_SECRET_KEY=change_me_jwt
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      - ./:/app

volumes:
  db_data:
